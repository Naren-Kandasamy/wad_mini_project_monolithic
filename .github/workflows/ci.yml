name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb-rs -p 27018:27018 mongo:7.0 --replSet rs0 --bind_ip_all --port 27018
          for i in {1..30}; do
            if docker exec mongodb-rs mongosh --port 27018 --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]}).ok }" --quiet | grep -q "1"; then
              echo "MongoDB replica set rs0 is ready!"
              break
            fi
            sleep 1
          done

      - name: Build and test with Maven
        run: mvn -B verify -f backend/pom.xml
