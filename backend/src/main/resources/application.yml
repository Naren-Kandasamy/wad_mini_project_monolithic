server:
  port: 8080

spring:
  application:
    name: shopping-cart-monolith
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/shopping-cart}
          audiences:
            - shopping-cart-api

app:
  security:
    expected-audience: shopping-cart-api
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Idempotency-Key
      - X-Request-Id
