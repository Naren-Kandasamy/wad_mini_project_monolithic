# ==============================================================================
# Render Blueprint Specification — Shopping Cart Monolith Backend API
# ==============================================================================
services:
  - type: web
    name: shopping-cart-monolith
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: MONGODB_URI
        sync: false # Connect to MongoDB Atlas replica set URI
      - key: KEYCLOAK_ISSUER_URI
        sync: false # Optional: Hosted Keycloak realm URL (e.g. https://auth.domain.com/realms/shopping-cart)
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
